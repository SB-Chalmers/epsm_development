name: Check the handbook

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check links and examples
        run: python scripts/check_docs.py
      - name: Test the documentation checks
        run: python -m unittest discover -s tests -v
      - name: Run the learning notebooks
        run: python scripts/run_examples.py

  api-documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the documentation tools
        run: python -m pip install -r requirements-docs.txt
      - name: Render the template API reference
        run: python scripts/build_api_example.py
